name: Release

# A push to main publishes a dev pre-release (vX.Y.Z.devN); a vX.Y.Z tag publishes a
# stable release after approval in the `release` environment.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# No concurrency group: each run publishes its own tag, and a group would keep only one
# pending run, dropping the dev release of a commit merged in between.

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous-stable: ${{ steps.version.outputs.previous-stable }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv build
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $REF_NAME does not match the built version $version"
            exit 1
          fi
          publish=true
          if [[ "$REF_TYPE" == branch && "$version" != *.dev* ]]; then
            echo "::notice::main is at stable tag v$version; its tag run publishes it"
            publish=false
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*.dev*' HEAD^ 2>/dev/null || true)
          {
            echo "version=$version"
            echo "previous-stable=$previous"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Require approval for stable releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          if [[ "$reviewers" -eq 0 ]]; then
            echo "::error::The release environment has no required reviewers; stable releases need approval"
            exit 1
          fi
      - name: Smoke-test the wheel over stdio
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --isolated --no-project --with dist/*.whl python scripts/smoke_stdio.py "$VERSION"
      - run: cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_type == 'tag' && 'release' || 'dev' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      # Draft first, publish last: with immutable releases the assets can't change
      # once the release is published.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS: ${{ needs.build.outputs.previous-stable }}
        run: |
          args=(--draft --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes)
          if [[ "$VERSION" == *.dev* ]]; then
            args+=(--prerelease)
          elif [[ -n "$PREVIOUS" ]]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "v$VERSION" "${args[@]}" dist/*
          gh release edit "v$VERSION" --draft=false
