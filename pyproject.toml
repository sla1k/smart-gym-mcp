[project]
name = "smart-gym-mcp"
dynamic = ["version"]
description = "Local stdio MCP server for SmartGym routines over the SmartGym HTTP API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",  # the tested 2.x API; installs don't read uv.lock
    "pydantic>=2",
    "httpx>=0.27",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Private :: Do Not Upload",
]

[project.scripts]
smartgym-mcp = "smartgym_mcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# main builds are 0.(minor+1).0.devN, N = commits since the last release tag (0.1.0.devN
# before the first one).
[tool.hatch.version.raw-options]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/smartgym_mcp"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
