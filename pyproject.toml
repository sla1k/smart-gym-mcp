[project]
name = "smart-gym-mcp"
version = "0.2.0"
description = "Local stdio MCP server wrapping SmartGym's Core Data SQLite DB"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Private :: Do Not Upload",
]

[project.scripts]
smartgym-mcp = "smartgym_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartgym_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# FastMCP's Context is generic; annotating the bare type is idiomatic in tool
# signatures, so relax the generics check for the server module only.
[[tool.mypy.overrides]]
module = "smartgym_mcp.server"
disallow_any_generics = false
