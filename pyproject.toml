[project]
name = "smart-gym-mcp"
dynamic = ["version"]
description = "Local stdio MCP server for SmartGym routines over the SmartGym HTTP API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",  # the tested 2.x API; installs don't read uv.lock
    "pydantic>=2.14",
    "httpx>=0.28",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: MacOS",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]

[project.scripts]
smartgym-mcp = "smartgym_mcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# main builds are 0.(minor+1).0.devN, N = commits since the last release tag (0.1.0.devN
# before the first one).
[tool.hatch.version.raw-options]
version_scheme = "release-branch-semver"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/smartgym_mcp"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# test modules import the shared helpers as `from fakes import ...`, in any import mode
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 95
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "I", "UP", "B", "SIM",
    "RUF", "C4", "PIE", "PERF", "FURB", "ASYNC", "T20", "ARG", "RET", "PT",
]
ignore = ["PT018"]  # composite asserts read fine in these tests
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts report on stdout; only the stdio server must keep it clean.
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined", "deprecated",
]
files = ["src", "tests", "scripts/smoke_stdio.py"]
